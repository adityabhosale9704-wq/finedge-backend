<!DOCTYPE html>
<html lang="en" data-page="recruitment">
<head>
<meta charset="UTF-8">
<title>Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1>Recruitment</h1>
      <div class="header-actions">
        <button type="button" class="btn-primary" id="add-candidate-button">+ Candidate</button>
        <button type="button" class="btn-primary" id="add-requisition-button">+ Requisition</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-gold"><i class="fa-solid fa-briefcase"></i></div>
        <div class="kpi-label">Open Requisitions</div>
        <div class="kpi-value" id="kpi-open-requisitions">0 / 0</div>
        <div class="kpi-sub">requisitions / openings</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-navy"><i class="fa-solid fa-user-clock"></i></div>
        <div class="kpi-label">In Pipeline</div>
        <div class="kpi-value" id="kpi-in-pipeline">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-amber"><i class="fa-solid fa-file-lines"></i></div>
        <div class="kpi-label">Documents Pending</div>
        <div class="kpi-value" id="kpi-docs-pending">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-green"><i class="fa-solid fa-user-check"></i></div>
        <div class="kpi-label">Joined</div>
        <div class="kpi-value" id="kpi-joined">0</div>
      </div>
    </div>

    <div id="page-error" class="form-error"></div>
    <div id="page-success" class="success-message"></div>
  </div>

  <div class="container">
    <h2>Live Requisitions</h2>
    <div id="requisitions-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading requisitions...</div></div>
    </div>
  </div>

  <div class="container">
    <h2>Candidates</h2>
    <div id="candidates-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading candidates...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="requisition-modal-overlay">
    <div class="modal-card">
      <h2 id="requisition-modal-title">Add Requisition</h2>
      <div id="requisition-form-error" class="form-error"></div>
      <form id="requisition-form">
        <div class="form-grid">
          <div class="field">
            <label for="req-role">Role</label>
            <input type="text" id="req-role" required>
          </div>
          <div class="field">
            <label for="req-branch">Branch</label>
            <select id="req-branch" required>
              <option value="" disabled selected>Select branch</option>
            </select>
          </div>
          <div class="field">
            <label for="req-openings">Openings</label>
            <input type="number" id="req-openings" min="1" value="1" required>
          </div>
          <div class="field">
            <label for="req-raised-by">Raised By</label>
            <input type="text" id="req-raised-by" required>
          </div>
          <div class="field">
            <label for="req-tat-days">TAT (days)</label>
            <input type="number" id="req-tat-days" min="1" value="30">
          </div>
          <div class="field">
            <label for="req-budget">Budget</label>
            <input type="text" id="req-budget" placeholder="e.g. ₹4-5 LPA">
          </div>
          <div class="field ui-display-none" id="req-stage-field">
            <label for="req-stage">Stage</label>
            <select id="req-stage">
              <option value="Open">Open</option>
              <option value="Sourcing">Sourcing</option>
              <option value="Interviewing">Interviewing</option>
              <option value="Offer Stage">Offer Stage</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="requisition-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="requisition-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="candidate-modal-overlay">
    <div class="modal-card">
      <h2 id="candidate-modal-title">Add Candidate</h2>
      <div id="candidate-form-error" class="form-error"></div>
      <form id="candidate-form">
        <div class="field">
          <label for="cand-name">Name</label>
          <input type="text" id="cand-name" required>
        </div>
        <div class="field">
          <label for="cand-phone">Phone</label>
          <input type="text" id="cand-phone">
        </div>
        <div class="field">
          <label for="cand-email">Email</label>
          <input type="email" id="cand-email">
        </div>
        <div class="field">
          <label for="cand-source">Source</label>
          <input type="text" id="cand-source" placeholder="e.g. Naukri, Referral, Walk-in">
        </div>
        <div class="field">
          <label for="cand-experience">Experience</label>
          <input type="text" id="cand-experience" placeholder="e.g. 3 yrs">
        </div>
        <div class="field">
          <label for="cand-requisition">Requisition</label>
          <select id="cand-requisition">
            <option value="">No requisition</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="candidate-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="candidate-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="approve-modal-overlay">
    <div class="modal-card">
      <h2>Approve Requisition</h2>
      <div id="approve-form-error" class="form-error"></div>
      <form id="approve-form">
        <div class="field">
          <label for="approve-name">Approved By</label>
          <input type="text" id="approve-name" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="approve-submit-button">Approve</button>
          <button type="button" class="btn-secondary" id="approve-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="reference-checks-modal-overlay">
    <div class="modal-card">
      <h2 id="reference-checks-modal-title">Reference Checks</h2>
      <div id="reference-checks-list"></div>
      <hr class="ui-margin-16px-0-border-color-var-line-2">
      <div id="reference-check-form-error" class="form-error"></div>
      <form id="reference-check-form">
        <input type="hidden" id="ref-check-editing-id">
        <div class="field">
          <label for="ref-referee-name">Referee Name</label>
          <input type="text" id="ref-referee-name" required>
        </div>
        <div class="field">
          <label for="ref-relationship">Relationship to Candidate</label>
          <input type="text" id="ref-relationship" placeholder="e.g. Ex-manager, Colleague">
        </div>
        <div class="field">
          <label for="ref-phone">Phone</label>
          <input type="text" id="ref-phone">
        </div>
        <div class="field">
          <label for="ref-status">Status</label>
          <select id="ref-status">
            <option value="Pending">Pending</option>
            <option value="Positive">Positive</option>
            <option value="Discrepancy">Discrepancy</option>
          </select>
        </div>
        <div class="field">
          <label for="ref-note">Note</label>
          <textarea id="ref-note" rows="2"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="reference-check-submit-button">Add Reference Check</button>
          <button type="button" class="btn-secondary" id="reference-check-cancel-button">Close</button>
        </div>
      </form>
    </div>
  </div>

  <script src="recruitment.js"></script>

</body>
</html>
