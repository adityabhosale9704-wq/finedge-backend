<!DOCTYPE html>
<html lang="en" data-page="workindia">
<head>
<meta charset="UTF-8">
<title>WorkIndia Import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <h1>WorkIndia Import</h1>
  </div>

  <div class="container">
    <div class="wi-tabs">
      <button type="button" class="wi-tab-btn active" data-tab="upload">Upload CSV</button>
      <button type="button" class="wi-tab-btn" data-tab="selected">Selected</button>
      <button type="button" class="wi-tab-btn" data-tab="log">Interview Calling Log</button>
    </div>

    <div id="page-error" class="form-error"></div>

    <div class="wi-tab-panel active" id="tab-upload">
      <h2>Upload CSV</h2>
      <div id="upload-error" class="form-error"></div>
      <div id="upload-success" class="success-message"></div>
      <div class="upload-row">
        <input type="file" id="csv-file-input" accept=".csv">
        <button type="button" class="btn-primary" id="import-button">Import</button>
      </div>

      <div class="toolbar ui-margin-top-20px">
        <h2 class="ui-margin-bottom-0">Uploaded Candidates</h2>
        <input type="text" id="search-input" class="search-input" placeholder="Search name, city, skills...">
      </div>
      <div class="form-actions ui-margin-10px-0">
        <button type="button" class="btn-primary" id="bulk-select-button">Move Checked to Selected</button>
      </div>
      <div id="upload-content">
        <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
      </div>
    </div>

    <div class="wi-tab-panel" id="tab-selected">
      <h2>Selected for Interview</h2>
      <div id="selected-content">
        <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
      </div>
    </div>

    <div class="wi-tab-panel" id="tab-log">
      <h2>Interview Calling Log</h2>
      <div id="log-content">
        <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="promote-modal-overlay">
    <div class="modal-card">
      <h2>Select for Interview</h2>
      <div id="promote-form-error" class="form-error"></div>
      <form id="promote-form">
        <div class="field">
          <label for="promote-requisition-select">Requisition</label>
          <select id="promote-requisition-select" required></select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="promote-submit-button">Confirm</button>
          <button type="button" class="btn-secondary" id="promote-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="log-call-modal-overlay">
    <div class="modal-card">
      <h2>Log Call</h2>
      <div id="log-call-form-error" class="form-error"></div>
      <form id="log-call-form">
        <div class="field">
          <label for="log-call-status">Call Status</label>
          <select id="log-call-status" required>
            <option value="Not Reached">Not Reached</option>
            <option value="Interested">Interested</option>
            <option value="Not Interested">Not Interested</option>
            <option value="Callback Requested">Callback Requested</option>
          </select>
        </div>
        <div class="field">
          <label for="log-call-notes">Call Notes</label>
          <textarea id="log-call-notes" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="log-call-email">Candidate Email</label>
          <input type="email" id="log-call-email">
        </div>
        <div class="field">
          <label for="log-call-position">Position / Designation Discussed</label>
          <input type="text" id="log-call-position">
        </div>
        <div class="field">
          <label for="log-call-datetime">Interview Date/Time</label>
          <input type="datetime-local" id="log-call-datetime">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="log-call-submit-button">Save</button>
          <button type="button" class="btn-secondary" id="log-call-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="workindia.js"></script>

</body>
</html>
