<!DOCTYPE html>
<html lang="en" data-page="interview-questions">
<head>
<meta charset="UTF-8">
<title>Interview Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1 class="ui-margin-bottom-0">Interview Questions Bank</h1>
      <button type="button" class="btn-primary" id="add-question-button">+ Add Question(s)</button>
    </div>
    <div class="form-actions ui-margin-12px-0">
      <input type="text" id="filter-department" placeholder="Filter by department">
      <select id="filter-type">
        <option value="">All Types</option>
        <option value="Technical">Technical</option>
        <option value="Behavioural">Behavioural</option>
        <option value="Situational">Situational</option>
        <option value="Role-specific">Role-specific</option>
        <option value="Culture fit">Culture fit</option>
      </select>
      <button type="button" class="btn-secondary" id="apply-filter-button">Apply Filter</button>
      <button type="button" class="btn-secondary" id="clear-filter-button">Clear</button>
    </div>
    <div id="page-error" class="form-error"></div>
    <div id="questions-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="question-modal-overlay">
    <div class="modal-card">
      <h2>Add Question(s)</h2>
      <div id="question-modal-form-error" class="form-error"></div>
      <form id="question-form">
        <div class="field"><label for="question-department">Department</label><input type="text" id="question-department" placeholder="e.g. Engineering"></div>
        <div class="field">
          <label for="question-type">Type</label>
          <select id="question-type" required>
            <option value="Technical">Technical</option>
            <option value="Behavioural">Behavioural</option>
            <option value="Situational">Situational</option>
            <option value="Role-specific">Role-specific</option>
            <option value="Culture fit">Culture fit</option>
          </select>
        </div>
        <div class="field">
          <label for="question-texts">Question(s)</label>
          <textarea id="question-texts" rows="6" placeholder="One question per line" required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="question-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="question-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="interview-questions.js"></script>

</body>
</html>
