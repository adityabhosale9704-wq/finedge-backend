<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Studio</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

  <div class="top-nav">
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    <div class="nav-links" id="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="positions.html">Employee IDs</a>
      <a href="recruitment.html">Recruitment</a>
      <a href="tasks.html">Tasks</a>
      <a href="admin.html" class="active">Admin Studio</a>
      <a href="workindia.html">WorkIndia Import</a>
    </div>
  </div>

  <div class="container">
    <h1>Admin Studio</h1>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h2 style="margin-bottom: 0;">Departments</h2>
      <button type="button" class="btn-primary" id="add-department-button">+ Add</button>
    </div>
    <div id="department-page-error" class="form-error"></div>
    <div id="departments-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading departments...</div></div>
    </div>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h2 style="margin-bottom: 0;">Branches</h2>
      <button type="button" class="btn-primary" id="add-branch-button">+ Add</button>
    </div>
    <div id="branch-page-error" class="form-error"></div>
    <div id="branches-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading branches...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="department-modal-overlay">
    <div class="modal-card">
      <h2 id="department-modal-title">Add Department</h2>
      <div id="department-form-error" class="form-error"></div>
      <form id="department-form">
        <div class="field">
          <label for="department-name">Name</label>
          <input type="text" id="department-name" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="department-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="department-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="branch-modal-overlay">
    <div class="modal-card">
      <h2 id="branch-modal-title">Add Branch</h2>
      <div id="branch-form-error" class="form-error"></div>
      <form id="branch-form">
        <div class="field">
          <label for="branch-name">Name</label>
          <input type="text" id="branch-name" required>
        </div>
        <div class="field">
          <label for="branch-city">City</label>
          <input type="text" id="branch-city" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="branch-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="branch-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    const DEPARTMENTS_API_BASE = 'http://127.0.0.1:8000/api/v1/departments/';
    const BRANCHES_API_BASE = 'http://127.0.0.1:8000/api/v1/branches/';

    if (!token) {
      window.location.href = 'login.html';
    } else {
      loadDepartments();
      loadBranches();
    }

    const navToggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');
    if (navToggle && navLinks) {
      navToggle.addEventListener('click', function () {
        navLinks.classList.toggle('open');
      });
    }

    let allDepartments = [];
    let allBranches = [];

    function escapeHtml(value) {
      if (value === undefined || value === null) {
        return '';
      }
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function handleUnauthorized(response) {
      if (response.status === 401) {
        localStorage.removeItem('authToken');
        window.location.href = 'login.html';
        return true;
      }
      return false;
    }

    // ---------- Departments ----------

    const departmentPageError = document.getElementById('department-page-error');

    async function loadDepartments() {
      const content = document.getElementById('departments-content');
      departmentPageError.style.display = 'none';

      try {
        const response = await fetch(DEPARTMENTS_API_BASE, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (handleUnauthorized(response)) {
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to load departments.');
        }

        allDepartments = await response.json();
        renderDepartments();
      } catch (err) {
        content.innerHTML = '<div class="error-state"><div>' +
          escapeHtml(err.message || 'Could not load departments.') +
          '</div><button type="button" class="btn-secondary" id="retry-departments-button">Retry</button></div>';
        document.getElementById('retry-departments-button').addEventListener('click', loadDepartments);
      }
    }

    function renderDepartments() {
      const content = document.getElementById('departments-content');

      if (allDepartments.length === 0) {
        content.innerHTML = '<div class="message">No departments added yet.</div>';
        return;
      }

      const rows = allDepartments.map(function (dept) {
        return '<tr>' +
          '<td>' + escapeHtml(dept.name) + '</td>' +
          '<td>' +
          '<button type="button" class="btn-edit btn-row edit-dept-btn" data-id="' + escapeHtml(dept.id) + '">Edit</button>' +
          '<button type="button" class="btn-delete btn-row delete-dept-btn" data-id="' + escapeHtml(dept.id) + '">Delete</button>' +
          '</td>' +
          '</tr>';
      }).join('');

      content.innerHTML =
        '<table><thead><tr><th>Name</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table>';

      content.querySelectorAll('.edit-dept-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const dept = allDepartments.find(function (d) { return d.id === btn.getAttribute('data-id'); });
          if (dept) {
            openDepartmentModal('edit', dept);
          }
        });
      });

      content.querySelectorAll('.delete-dept-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          handleDeleteDepartment(btn.getAttribute('data-id'));
        });
      });
    }

    const departmentModalOverlay = document.getElementById('department-modal-overlay');
    const departmentModalTitle = document.getElementById('department-modal-title');
    const departmentForm = document.getElementById('department-form');
    const departmentFormError = document.getElementById('department-form-error');
    const departmentSubmitButton = document.getElementById('department-submit-button');
    const departmentCancelButton = document.getElementById('department-cancel-button');

    let editingDepartmentId = null;

    document.getElementById('add-department-button').addEventListener('click', function () {
      openDepartmentModal('add', null);
    });
    departmentForm.addEventListener('submit', handleDepartmentSubmit);
    departmentCancelButton.addEventListener('click', closeDepartmentModal);
    departmentModalOverlay.addEventListener('click', function (event) {
      if (event.target === departmentModalOverlay) {
        closeDepartmentModal();
      }
    });

    function openDepartmentModal(mode, dept) {
      editingDepartmentId = mode === 'edit' && dept ? dept.id : null;
      departmentModalTitle.textContent = mode === 'edit' ? 'Edit Department' : 'Add Department';
      departmentSubmitButton.textContent = mode === 'edit' ? 'Update' : 'Add';
      document.getElementById('department-name').value = dept ? (dept.name || '') : '';
      departmentFormError.style.display = 'none';
      departmentModalOverlay.classList.add('open');
    }

    function closeDepartmentModal() {
      departmentModalOverlay.classList.remove('open');
      departmentForm.reset();
      editingDepartmentId = null;
    }

    async function handleDepartmentSubmit(event) {
      event.preventDefault();
      departmentSubmitButton.disabled = true;
      departmentFormError.style.display = 'none';

      const payload = { name: document.getElementById('department-name').value };
      const isEditing = editingDepartmentId !== null;
      const url = isEditing ? DEPARTMENTS_API_BASE + editingDepartmentId + '/' : DEPARTMENTS_API_BASE;
      const method = isEditing ? 'PATCH' : 'POST';

      try {
        const response = await fetch(url, {
          method: method,
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (handleUnauthorized(response)) {
          return;
        }

        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          throw new Error(data.detail || 'Could not save department.');
        }

        closeDepartmentModal();
        loadDepartments();
      } catch (err) {
        departmentFormError.textContent = err.message || 'Something went wrong. Please try again.';
        departmentFormError.style.display = 'block';
      } finally {
        departmentSubmitButton.disabled = false;
      }
    }

    async function handleDeleteDepartment(deptId) {
      const confirmed = confirm('Are you sure you want to delete this department?');
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(DEPARTMENTS_API_BASE + deptId + '/', {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (handleUnauthorized(response)) {
          return;
        }

        if (!response.ok && response.status !== 204) {
          throw new Error('Could not delete department.');
        }

        loadDepartments();
      } catch (err) {
        departmentPageError.textContent = err.message || 'Something went wrong. Please try again.';
        departmentPageError.style.display = 'block';
      }
    }

    // ---------- Branches ----------

    const branchPageError = document.getElementById('branch-page-error');

    async function loadBranches() {
      const content = document.getElementById('branches-content');
      branchPageError.style.display = 'none';

      try {
        const response = await fetch(BRANCHES_API_BASE, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (handleUnauthorized(response)) {
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to load branches.');
        }

        allBranches = await response.json();
        renderBranches();
      } catch (err) {
        content.innerHTML = '<div class="error-state"><div>' +
          escapeHtml(err.message || 'Could not load branches.') +
          '</div><button type="button" class="btn-secondary" id="retry-branches-button">Retry</button></div>';
        document.getElementById('retry-branches-button').addEventListener('click', loadBranches);
      }
    }

    function renderBranches() {
      const content = document.getElementById('branches-content');

      if (allBranches.length === 0) {
        content.innerHTML = '<div class="message">No branches added yet.</div>';
        return;
      }

      const rows = allBranches.map(function (branch) {
        return '<tr>' +
          '<td>' + escapeHtml(branch.name) + '</td>' +
          '<td>' + escapeHtml(branch.city) + '</td>' +
          '<td>' +
          '<button type="button" class="btn-edit btn-row edit-branch-btn" data-id="' + escapeHtml(branch.id) + '">Edit</button>' +
          '<button type="button" class="btn-delete btn-row delete-branch-btn" data-id="' + escapeHtml(branch.id) + '">Delete</button>' +
          '</td>' +
          '</tr>';
      }).join('');

      content.innerHTML =
        '<table><thead><tr><th>Name</th><th>City</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table>';

      content.querySelectorAll('.edit-branch-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const branch = allBranches.find(function (b) { return b.id === btn.getAttribute('data-id'); });
          if (branch) {
            openBranchModal('edit', branch);
          }
        });
      });

      content.querySelectorAll('.delete-branch-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          handleDeleteBranch(btn.getAttribute('data-id'));
        });
      });
    }

    const branchModalOverlay = document.getElementById('branch-modal-overlay');
    const branchModalTitle = document.getElementById('branch-modal-title');
    const branchForm = document.getElementById('branch-form');
    const branchFormError = document.getElementById('branch-form-error');
    const branchSubmitButton = document.getElementById('branch-submit-button');
    const branchCancelButton = document.getElementById('branch-cancel-button');

    let editingBranchId = null;

    document.getElementById('add-branch-button').addEventListener('click', function () {
      openBranchModal('add', null);
    });
    branchForm.addEventListener('submit', handleBranchSubmit);
    branchCancelButton.addEventListener('click', closeBranchModal);
    branchModalOverlay.addEventListener('click', function (event) {
      if (event.target === branchModalOverlay) {
        closeBranchModal();
      }
    });

    function openBranchModal(mode, branch) {
      editingBranchId = mode === 'edit' && branch ? branch.id : null;
      branchModalTitle.textContent = mode === 'edit' ? 'Edit Branch' : 'Add Branch';
      branchSubmitButton.textContent = mode === 'edit' ? 'Update' : 'Add';
      document.getElementById('branch-name').value = branch ? (branch.name || '') : '';
      document.getElementById('branch-city').value = branch ? (branch.city || '') : '';
      branchFormError.style.display = 'none';
      branchModalOverlay.classList.add('open');
    }

    function closeBranchModal() {
      branchModalOverlay.classList.remove('open');
      branchForm.reset();
      editingBranchId = null;
    }

    async function handleBranchSubmit(event) {
      event.preventDefault();
      branchSubmitButton.disabled = true;
      branchFormError.style.display = 'none';

      const payload = {
        name: document.getElementById('branch-name').value,
        city: document.getElementById('branch-city').value
      };
      const isEditing = editingBranchId !== null;
      const url = isEditing ? BRANCHES_API_BASE + editingBranchId + '/' : BRANCHES_API_BASE;
      const method = isEditing ? 'PATCH' : 'POST';

      try {
        const response = await fetch(url, {
          method: method,
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (handleUnauthorized(response)) {
          return;
        }

        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          throw new Error(data.detail || 'Could not save branch.');
        }

        closeBranchModal();
        loadBranches();
      } catch (err) {
        branchFormError.textContent = err.message || 'Something went wrong. Please try again.';
        branchFormError.style.display = 'block';
      } finally {
        branchSubmitButton.disabled = false;
      }
    }

    async function handleDeleteBranch(branchId) {
      const confirmed = confirm('Are you sure you want to delete this branch?');
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(BRANCHES_API_BASE + branchId + '/', {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (handleUnauthorized(response)) {
          return;
        }

        if (!response.ok && response.status !== 204) {
          throw new Error('Could not delete branch.');
        }

        loadBranches();
      } catch (err) {
        branchPageError.textContent = err.message || 'Something went wrong. Please try again.';
        branchPageError.style.display = 'block';
      }
    }
  </script>

</body>
</html>
