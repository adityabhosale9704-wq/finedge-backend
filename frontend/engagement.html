<!DOCTYPE html>
<html lang="en" data-page="engagement">
<head>
<meta charset="UTF-8">
<title>Engagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <h1>Engagement</h1>
  </div>

  <div class="container">
    <h2>Celebrations This Month</h2>
    <div id="celebrations-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h2 class="ui-margin-bottom-0">Contests</h2>
      <button type="button" class="btn-primary" id="add-contest-button">+ Add Contest</button>
    </div>
    <div id="contest-form-error" class="form-error"></div>
    <div id="contests-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading contests...</div></div>
    </div>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h2 class="ui-margin-bottom-0">Suggestion Box</h2>
      <button type="button" class="btn-primary" id="add-suggestion-button">+ Add Suggestion</button>
    </div>
    <div id="suggestion-form-error" class="form-error"></div>
    <div id="suggestions-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading suggestions...</div></div>
    </div>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h2 class="ui-margin-bottom-0">Activity Calendar</h2>
      <button type="button" class="btn-primary" id="add-activity-button">+ Add Activity</button>
    </div>
    <div id="activity-form-error" class="form-error"></div>
    <div id="activities-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading activities...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="contest-modal-overlay">
    <div class="modal-card">
      <h2 id="contest-modal-title">Add Contest</h2>
      <div id="contest-modal-form-error" class="form-error"></div>
      <form id="contest-form">
        <div class="field"><label for="contest-name">Name</label><input type="text" id="contest-name" required></div>
        <div class="field"><label for="contest-audience">Audience</label><input type="text" id="contest-audience"></div>
        <div class="field"><label for="contest-start">Period Start</label><input type="date" id="contest-start"></div>
        <div class="field"><label for="contest-end">Period End</label><input type="date" id="contest-end"></div>
        <div class="field"><label for="contest-metric">Target Metric</label><input type="text" id="contest-metric"></div>
        <div class="field"><label for="contest-prize">Prize</label><input type="text" id="contest-prize"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="contest-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="contest-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="suggestion-modal-overlay">
    <div class="modal-card">
      <h2>Add Suggestion</h2>
      <div id="suggestion-modal-form-error" class="form-error"></div>
      <form id="suggestion-form">
        <div class="field"><label for="suggestion-submitted-by">Submitted By</label><input type="text" id="suggestion-submitted-by" placeholder="Leave blank for Anonymous"></div>
        <div class="field"><label for="suggestion-text">Suggestion</label><textarea id="suggestion-text" rows="4" required></textarea></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="suggestion-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="suggestion-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="activity-modal-overlay">
    <div class="modal-card">
      <h2 id="activity-modal-title">Add Activity</h2>
      <div id="activity-modal-form-error" class="form-error"></div>
      <form id="activity-form">
        <div class="field"><label for="activity-name">Name</label><input type="text" id="activity-name" required></div>
        <div class="field"><label for="activity-date">Date / Recurrence</label><input type="text" id="activity-date" placeholder="e.g. 2026-10-15, or 'Every Friday'"></div>
        <div class="field"><label for="activity-audience">Audience</label><input type="text" id="activity-audience"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="activity-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="activity-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="engagement.js"></script>

</body>
</html>
