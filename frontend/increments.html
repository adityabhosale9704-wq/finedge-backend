<!DOCTYPE html>
<html lang="en" data-page="increments">
<head>
<meta charset="UTF-8">
<title>Increments &amp; Payouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1>Increments &amp; Payout Structures</h1>
      <button type="button" class="btn-primary" id="add-structure-button">+ Add Structure</button>
    </div>
  </div>

  <div class="container">
    <div id="page-error" class="form-error"></div>
    <div id="structures-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading incentive structures...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="structure-modal-overlay">
    <div class="modal-card">
      <h2 id="structure-modal-title">Add Structure</h2>
      <div id="structure-form-error" class="form-error"></div>
      <form id="structure-form">
        <div class="field">
          <label for="structure-name">Name</label>
          <input type="text" id="structure-name" placeholder="e.g. Sales Incentive" required>
        </div>
        <div class="field">
          <label for="structure-department">Department</label>
          <input type="text" id="structure-department">
        </div>
        <div class="field">
          <label for="structure-bonus-threshold">Bonus Threshold</label>
          <input type="number" id="structure-bonus-threshold" step="any" value="0">
        </div>
        <div class="field">
          <label for="structure-bonus-amount">Bonus Amount</label>
          <input type="number" id="structure-bonus-amount" step="any" value="0">
        </div>
        <div class="field">
          <label>Slabs</label>
          <div id="slabs-editor"></div>
          <button type="button" class="btn-secondary ui-margin-top-6px" id="add-slab-row-button">+ Add Slab</button>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="structure-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="structure-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="increments.js"></script>

</body>
</html>
