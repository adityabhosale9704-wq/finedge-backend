<!DOCTYPE html>
<html lang="en" data-page="compliance">
<head>
<meta charset="UTF-8">
<title>Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1 class="ui-margin-bottom-0">Compliance</h1>
      <button type="button" class="btn-primary" id="add-item-button">+ Add Compliance Item</button>
    </div>
    <div id="form-error" class="form-error"></div>
    <div id="items-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
  </div>

  <div class="container">
    <h2>Shops &amp; Establishments Registration by Branch</h2>
    <div id="branches-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading branches...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="item-modal-overlay">
    <div class="modal-card">
      <h2 id="item-modal-title">Add Compliance Item</h2>
      <div id="item-modal-form-error" class="form-error"></div>
      <form id="item-form">
        <div class="field"><label for="item-act-name">Act Name</label><input type="text" id="item-act-name" required></div>
        <div class="field"><label for="item-frequency">Frequency</label><input type="text" id="item-frequency" placeholder="e.g. Monthly, Yearly"></div>
        <div class="field"><label for="item-owner">Owner</label><input type="text" id="item-owner"></div>
        <div class="field"><label for="item-due-date">Next Due Date</label><input type="date" id="item-due-date" required></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="item-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="item-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="compliance.js"></script>

</body>
</html>
