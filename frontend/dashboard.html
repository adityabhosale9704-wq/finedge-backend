<!DOCTYPE html>
<html lang="en" data-page="dashboard">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <div>
        <h1 id="greeting-heading">Hello</h1>
        <div class="greeting-date" id="greeting-date"></div>
      </div>
      <div id="global-branch-filter-container"></div>
    </div>
  </div>

  <div class="container">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-navy"><i class="fa-solid fa-users"></i></div>
        <div class="kpi-label">Total Active Employees</div>
        <div class="kpi-value" id="kpi-active-employees">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-gold"><i class="fa-solid fa-briefcase"></i></div>
        <div class="kpi-label">Open Requisitions</div>
        <div class="kpi-value" id="kpi-open-requisitions">0</div>
        <div class="kpi-sub" id="kpi-open-requisitions-sub">0 openings</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-navy"><i class="fa-solid fa-user-clock"></i></div>
        <div class="kpi-label">Candidates In Pipeline</div>
        <div class="kpi-value" id="kpi-in-pipeline">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="kpi-label">Overdue Tasks</div>
        <div class="kpi-value" id="kpi-overdue-tasks">0</div>
      </div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="container">
      <h2>This Week's Scoreboard</h2>
      <div class="scoreboard-grid">
        <div class="status-tile tile-green">
          <div class="tile-value" id="score-early">0</div>
          <div class="tile-label">Early</div>
        </div>
        <div class="status-tile tile-green">
          <div class="tile-value" id="score-ontime">0</div>
          <div class="tile-label">On Time</div>
        </div>
        <div class="status-tile tile-amber">
          <div class="tile-value" id="score-delayed">0</div>
          <div class="tile-label">Delayed</div>
        </div>
        <div class="status-tile tile-red">
          <div class="tile-value" id="score-overdue">0</div>
          <div class="tile-label">Overdue</div>
        </div>
        <div class="status-tile tile-navy">
          <div class="tile-value" id="score-open">0</div>
          <div class="tile-label">Open</div>
        </div>
      </div>
    </div>

    <div class="container">
      <h2>Needs Attention</h2>
      <div id="attention-content">
        <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>Upcoming Celebrations</h2>
    <div id="celebrations-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
  </div>

  <script src="dashboard.js"></script>

</body>
</html>
