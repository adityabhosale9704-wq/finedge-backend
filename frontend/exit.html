<!DOCTYPE html>
<html lang="en" data-page="exit">
<head>
<meta charset="UTF-8">
<title>Exit &amp; Separation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1>Exit &amp; Separation</h1>
      <div class="ui-display-flex-align-items-center-gap-14px">
        <div id="global-branch-filter-container"></div>
        <button type="button" class="btn-primary" id="add-separation-button">+ New Separation</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>In Progress</h2>
    <div id="page-error" class="form-error"></div>
    <div id="separations-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading separations...</div></div>
    </div>
  </div>

  <div class="container">
    <h2>Completed</h2>
    <div id="completed-content">
      <div class="message">No completed separations yet.</div>
    </div>
  </div>

  <div class="modal-overlay" id="separation-modal-overlay">
    <div class="modal-card">
      <h2>New Separation</h2>
      <div id="separation-form-error" class="form-error"></div>
      <form id="separation-form">
        <div class="field">
          <label for="sep-employee">Employee</label>
          <select id="sep-employee" required></select>
        </div>
        <div class="field">
          <label for="sep-resignation-date">Resignation Date</label>
          <input type="date" id="sep-resignation-date" required>
        </div>
        <div class="field">
          <label for="sep-last-working-day">Last Working Day</label>
          <input type="date" id="sep-last-working-day" required>
        </div>
        <div class="field">
          <label for="sep-notice-period">Notice Period (days)</label>
          <input type="number" id="sep-notice-period" min="0" value="30">
        </div>
        <div class="field">
          <label for="sep-reason">Reason</label>
          <input type="text" id="sep-reason" placeholder="e.g. Personal, Better opportunity">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="separation-submit-button">Create</button>
          <button type="button" class="btn-secondary" id="separation-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="exit.js"></script>

</body>
</html>
