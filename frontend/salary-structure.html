<!DOCTYPE html>
<html lang="en" data-page="salary-structure">
<head>
<meta charset="UTF-8">
<title>Salary Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <h1>Salary Structure</h1>
  </div>

  <div class="container">
    <h2>Structure Rules</h2>
    <div id="structure-form-error" class="form-error"></div>
    <div id="structure-success" class="success-message"></div>
    <div id="structure-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading structure...</div></div>
    </div>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h2 class="ui-margin-bottom-0">Revision Queue</h2>
      <button type="button" class="btn-primary" id="add-revision-button">+ Propose Revision</button>
    </div>
    <div id="revision-page-error" class="form-error"></div>
    <div id="revisions-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading revisions...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="revision-modal-overlay">
    <div class="modal-card">
      <h2>Propose Salary Revision</h2>
      <div id="revision-form-error" class="form-error"></div>
      <form id="revision-form">
        <div class="field">
          <label for="revision-employee">Employee</label>
          <select id="revision-employee" required></select>
        </div>
        <div class="field">
          <label for="revision-current-ctc">Current CTC</label>
          <input type="number" id="revision-current-ctc" step="any" required>
        </div>
        <div class="field">
          <label for="revision-proposed-ctc">Proposed CTC</label>
          <input type="number" id="revision-proposed-ctc" step="any" required>
        </div>
        <div class="field">
          <label for="revision-effective-date">Effective Date</label>
          <input type="date" id="revision-effective-date" required>
        </div>
        <div class="field">
          <label for="revision-reason">Reason</label>
          <input type="text" id="revision-reason" placeholder="e.g. Annual increment">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="revision-submit-button">Propose</button>
          <button type="button" class="btn-secondary" id="revision-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="salary-structure.js"></script>

</body>
</html>
