<!DOCTYPE html>
<html lang="en" data-page="docs-vault">
<head>
<meta charset="UTF-8">
<title>Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <h1>Docs</h1>
    <p class="ui-color-var-mut-margin-top-8px">Search for one person's documents without opening their full profile.</p>
    <div class="tabs ui-margin-14px-0" id="docs-tabs">
      <button type="button" class="tab active" data-panel="employees">Employees</button>
      <button type="button" class="tab" data-panel="candidates">Interview Candidates</button>
      <button type="button" class="tab" data-panel="leavers">Leaver</button>
    </div>

    <input type="text" id="docs-search-input" class="search-input ui-margin-bottom-14px-max-width-320px" placeholder="Search by name...">
    <div id="page-error" class="form-error"></div>

    <div class="docs-panel active" id="panel-employees">
      <div id="employees-list" class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
    <div class="docs-panel" id="panel-candidates">
      <div id="candidates-list" class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
    <div class="docs-panel" id="panel-leavers">
      <div id="leavers-list" class="loading-state"><div class="spinner"></div><div>Loading...</div></div>
    </div>
  </div>

  <script src="docs-vault.js"></script>

</body>
</html>
