<!DOCTYPE html>
<html lang="en" data-page="positions">
<head>
<meta charset="UTF-8">
<title>Employee ID Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1>Employee ID Management</h1>
      <button type="button" class="btn-primary" id="add-position-button">+ Add Employee ID</button>
    </div>
  </div>

  <div class="container">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-navy"><i class="fa-solid fa-id-badge"></i></div>
        <div class="kpi-label">Total Employee IDs</div>
        <div class="kpi-value" id="kpi-total">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-green"><i class="fa-solid fa-circle-check"></i></div>
        <div class="kpi-label">Active</div>
        <div class="kpi-value" id="kpi-active">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-gold"><i class="fa-solid fa-user-slash"></i></div>
        <div class="kpi-label">Vacant</div>
        <div class="kpi-value" id="kpi-vacant">0</div>
      </div>
    </div>

    <div id="page-error" class="form-error"></div>
    <div id="content">
      <div class="loading-state"><div class="spinner"></div><div>Loading employee IDs...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="position-modal-overlay">
    <div class="modal-card">
      <h2 id="position-modal-title">Add Employee ID</h2>
      <div id="position-form-error" class="form-error"></div>
      <form id="position-form">
        <div class="field">
          <label for="position-designation">Designation</label>
          <input type="text" id="position-designation" required>
        </div>
        <div class="field">
          <label for="position-department">Department</label>
          <select id="position-department" required>
            <option value="" disabled selected>Select department</option>
          </select>
        </div>
        <div class="field">
          <label for="position-branch">Branch</label>
          <select id="position-branch" required>
            <option value="" disabled selected>Select branch</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="position-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="position-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="assign-modal-overlay">
    <div class="modal-card">
      <h2>Assign Employee</h2>
      <div id="assign-form-error" class="form-error"></div>
      <form id="assign-form">
        <div class="field">
          <label for="assign-employee-select">Employee</label>
          <select id="assign-employee-select" required></select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="assign-submit-button">Assign</button>
          <button type="button" class="btn-secondary" id="assign-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="history-modal-overlay">
    <div class="modal-card">
      <h2 id="history-modal-title">Position History</h2>
      <div id="history-content"></div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="history-close-button">Close</button>
      </div>
    </div>
  </div>

  <script src="positions.js"></script>

</body>
</html>
