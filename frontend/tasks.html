<!DOCTYPE html>
<html lang="en" data-page="tasks">
<head>
<meta charset="UTF-8">
<title>TAT / Task Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="stylesheet" href="shared.css?v=16">
<script src="config.js?v=15"></script>
<script src="api.js?v=15"></script>
<script src="shared.js?v=15"></script>
</head>
<body>

  <div class="top-nav" id="app-sidebar"></div>

  <div class="container">
    <div class="page-header-row">
      <h1>TAT Tracker</h1>
      <div class="ui-display-flex-align-items-center-gap-14px">
        <div id="global-branch-filter-container"></div>
        <button type="button" class="btn-primary" id="add-task-button">+ New Task</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-green"><i class="fa-solid fa-forward"></i></div>
        <div class="kpi-label">Early</div>
        <div class="kpi-value" id="kpi-early">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-green"><i class="fa-solid fa-circle-check"></i></div>
        <div class="kpi-label">On Time</div>
        <div class="kpi-value" id="kpi-ontime">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-amber"><i class="fa-solid fa-clock"></i></div>
        <div class="kpi-label">Delayed</div>
        <div class="kpi-value" id="kpi-delayed">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="kpi-label">Overdue</div>
        <div class="kpi-value" id="kpi-overdue">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon-navy"><i class="fa-solid fa-hourglass-half"></i></div>
        <div class="kpi-label">Open</div>
        <div class="kpi-value" id="kpi-open">0</div>
      </div>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="All" id="tab-All">All (0)</button>
      <button type="button" class="tab" data-tab="Open" id="tab-Open">In Progress (0)</button>
      <button type="button" class="tab" data-tab="Early" id="tab-Early">Early (0)</button>
      <button type="button" class="tab" data-tab="On Time" id="tab-On Time">On Time (0)</button>
      <button type="button" class="tab" data-tab="Delayed" id="tab-Delayed">Delayed (0)</button>
      <button type="button" class="tab" data-tab="Overdue" id="tab-Overdue">Overdue (0)</button>
    </div>

    <div id="page-error" class="form-error"></div>
    <div id="tasks-content">
      <div class="loading-state"><div class="spinner"></div><div>Loading tasks...</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="task-modal-overlay">
    <div class="modal-card">
      <h2 id="task-modal-title">New Task</h2>
      <div id="task-form-error" class="form-error"></div>
      <form id="task-form">
        <div class="field">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" required>
        </div>
        <div class="field">
          <label for="task-department">Department</label>
          <input type="text" id="task-department" required>
        </div>
        <div class="field">
          <label for="task-assigned-to">Assigned To</label>
          <select id="task-assigned-to" required></select>
        </div>
        <div class="field">
          <label for="task-tat-days">TAT (days)</label>
          <input type="number" id="task-tat-days" min="1" value="3" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="task-submit-button">Add</button>
          <button type="button" class="btn-secondary" id="task-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="tasks.js"></script>

</body>
</html>
