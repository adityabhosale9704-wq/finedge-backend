<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employees</title>
<link rel="stylesheet" href="shared.css">
<style>
  #list-view h1 {
    margin-bottom: 20px;
  }

  .tab.disabled-tab {
    color: #9aa1a8;
  }

  tr.clickable-row {
    cursor: pointer;
  }

  .doc-summary {
    font-size: 13px;
    color: #666;
  }

  /* Profile view */

  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #4a90e2;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .avatar-small {
    width: 32px;
    height: 32px;
    font-size: 13px;
  }

  .profile-header {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .profile-identity {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .profile-name {
    font-size: 19px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .profile-subtitle {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }

  .profile-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  #profile-view .kpi-value {
    font-size: 16px;
  }

  .profile-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 12px;
    margin-bottom: 20px;
  }

  .kv-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 24px;
    margin-bottom: 24px;
  }

  @media (max-width: 640px) {
    .kv-grid {
      grid-template-columns: 1fr;
    }
  }

  .kv-item {
    border-bottom: 1px solid #f0f1f3;
    padding-bottom: 8px;
  }

  .kv-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 3px;
  }

  .kv-value {
    font-size: 14px;
    color: #1a1a1a;
  }

  .section-heading-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  @media print {
    .container:not(#profile-view) {
      display: none !important;
    }
    .profile-actions,
    .search-input,
    .toolbar {
      display: none !important;
    }
  }

  /* Letters tab */

  .letters-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .letters-layout {
      grid-template-columns: 1fr;
    }
  }

  .saved-letters-list {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
  }

  .saved-letters-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f1f3;
    font-size: 14px;
  }

  .letterhead {
    text-align: center;
    margin-bottom: 20px;
  }

  .letterhead h2 {
    margin: 0 0 4px;
    font-size: 18px;
  }

  .letter-meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #666;
    margin-bottom: 16px;
  }

  .letter-title {
    text-align: center;
    text-decoration: underline;
    margin: 0 0 16px;
    font-size: 15px;
  }

  .letter-body p {
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 12px;
  }

  .letter-preview-card {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 24px;
  }

  @media print {
    body.printing-letter .profile-header,
    body.printing-letter .kpi-grid,
    body.printing-letter .profile-tabs,
    body.printing-letter #letter-generate-panel,
    body.printing-letter #saved-letters-section {
      display: none !important;
    }
    body.printing-letter .letter-preview-card {
      border: none;
      padding: 0;
    }
  }
</style>
</head>
<body>

  <div class="top-nav">
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    <div class="nav-links" id="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="employees.html" class="active">Employees</a>
      <a href="positions.html">Employee IDs</a>
      <a href="recruitment.html">Recruitment</a>
      <a href="tasks.html">Tasks</a>
      <a href="admin.html">Admin Studio</a>
      <a href="workindia.html">WorkIndia Import</a>
    </div>
  </div>

  <div class="container">
    <h2 id="form-title">Add Employee</h2>
    <div id="form-error" class="form-error"></div>
    <form id="employee-form">
      <div class="form-grid">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone" required>
        </div>
        <div class="field">
          <label for="department">Department</label>
          <select id="department" name="department" required>
            <option value="" disabled selected>Select department</option>
          </select>
        </div>
        <div class="field">
          <label for="designation">Designation</label>
          <input type="text" id="designation" name="designation" required>
        </div>
        <div class="field">
          <label for="branch">Branch</label>
          <select id="branch" name="branch" required>
            <option value="" disabled selected>Select branch</option>
          </select>
        </div>
        <div class="field">
          <label for="date_of_joining">Date of Joining</label>
          <input type="date" id="date_of_joining" name="date_of_joining" required>
        </div>
        <div class="field">
          <label for="ctc">CTC</label>
          <input type="number" id="ctc" name="ctc" step="any" required>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="field">
          <label for="blood_group">Blood Group</label>
          <input type="text" id="blood_group" name="blood_group" maxlength="5" placeholder="e.g. O+">
        </div>
        <div class="field">
          <label for="kra_score">KRA Score</label>
          <input type="number" id="kra_score" name="kra_score" min="0" max="100" placeholder="e.g. 85">
        </div>
        <div class="field">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob">
        </div>
        <div class="field">
          <label for="marital_status">Marital Status</label>
          <select id="marital_status" name="marital_status">
            <option value="">Select</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
          </select>
        </div>
      </div>

      <h2 style="margin-top: 24px;">Statutory &amp; Bank</h2>
      <div class="form-grid">
        <div class="field">
          <label for="pan">PAN</label>
          <input type="text" id="pan" name="pan" placeholder="e.g. ABCDE1234F">
        </div>
        <div class="field">
          <label for="aadhaar">Aadhaar</label>
          <input type="text" id="aadhaar" name="aadhaar" placeholder="e.g. 1234 5678 9012">
        </div>
        <div class="field">
          <label for="uan">UAN (PF)</label>
          <input type="text" id="uan" name="uan">
        </div>
        <div class="field">
          <label for="esic">ESIC IP No.</label>
          <input type="text" id="esic" name="esic">
        </div>
        <div class="field">
          <label for="bank_account">Salary Bank Account</label>
          <input type="text" id="bank_account" name="bank_account">
        </div>
      </div>
      <div class="form-actions">
        <label><input type="checkbox" id="pf_nomination_on_file"> PF nomination on file</label>
        <label><input type="checkbox" id="gratuity_nomination_on_file"> Gratuity nomination on file</label>
        <label><input type="checkbox" id="policy_accepted"> Policy handbook accepted</label>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-button" class="btn-primary">Add Employee</button>
        <button type="button" id="cancel-edit-button" class="btn-secondary" style="display: none;">Cancel</button>
      </div>
    </form>
  </div>

  <div id="list-view">
    <div class="container">
      <h1>Employees</h1>
      <div class="toolbar">
        <div class="tabs">
          <button type="button" class="tab active" id="tab-active" data-tab="active">Active (0)</button>
          <button type="button" class="tab" id="tab-leaver" data-tab="leaver">Leaver (0)</button>
        </div>
        <input type="text" id="search-input" class="search-input" placeholder="Search employees...">
      </div>
      <div id="content">
        <div class="loading-state"><div class="spinner"></div><div>Loading employees...</div></div>
      </div>
    </div>
  </div>

  <div id="profile-view" class="container" style="display: none;">
    <div class="profile-header">
      <div class="profile-identity">
        <div class="avatar" id="profile-avatar"></div>
        <div>
          <div class="profile-name" id="profile-name"></div>
          <div class="profile-subtitle" id="profile-subtitle"></div>
        </div>
      </div>
      <div class="profile-actions">
        <button type="button" class="btn-secondary" id="profile-back-button">&larr; Back</button>
        <button type="button" class="btn-secondary" id="profile-print-button">&#128424; Print</button>
        <button type="button" class="btn-secondary" id="profile-edit-button">&#9998; Edit</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Date of Joining</div>
        <div class="kpi-value" id="kpi-doj">&mdash;</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">CTC</div>
        <div class="kpi-value" id="kpi-ctc">&mdash;</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Blood Group</div>
        <div class="kpi-value" id="kpi-blood-group">&mdash;</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Emergency Contact</div>
        <div class="kpi-value" id="kpi-emergency-name">&mdash;</div>
        <div class="kpi-sub" id="kpi-emergency-phone"></div>
      </div>
    </div>

    <div class="profile-tabs">
      <button type="button" class="tab active" id="ptab-personal" data-ptab="personal">Personal &amp; Family</button>
      <button type="button" class="tab" id="ptab-documents" data-ptab="documents">Document Vault</button>
      <button type="button" class="tab" id="ptab-statutory" data-ptab="statutory">Statutory &amp; Bank</button>
      <button type="button" class="tab" id="ptab-facilities" data-ptab="facilities">Facilities &amp; Assets</button>
      <button type="button" class="tab" id="ptab-letters" data-ptab="letters">Letters</button>
    </div>

    <div id="profile-tab-content"></div>
  </div>

  <div class="modal-overlay" id="family-modal-overlay">
    <div class="modal-card">
      <h2 id="family-modal-title">Add Family Member</h2>
      <div id="family-form-error" class="form-error"></div>
      <form id="family-form">
        <div class="field">
          <label for="family-relation">Relation</label>
          <input type="text" id="family-relation" required>
        </div>
        <div class="field">
          <label for="family-name">Name</label>
          <input type="text" id="family-name" required>
        </div>
        <div class="field">
          <label for="family-dob">Date of Birth</label>
          <input type="date" id="family-dob">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="family-submit-button">Add Member</button>
          <button type="button" class="btn-secondary" id="family-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="facility-modal-overlay">
    <div class="modal-card">
      <h2 id="facility-modal-title">Add Facility/Asset</h2>
      <div id="facility-form-error" class="form-error"></div>
      <form id="facility-form">
        <div class="field">
          <label for="facility-item">Item</label>
          <input type="text" id="facility-item" placeholder="e.g. Company Laptop" required>
        </div>
        <div class="field">
          <label for="facility-issued-date">Issued Date</label>
          <input type="date" id="facility-issued-date">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="facility-submit-button">Add Item</button>
          <button type="button" class="btn-secondary" id="facility-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="doc-upload-modal-overlay">
    <div class="modal-card">
      <h2 id="doc-upload-modal-title">Upload Document</h2>
      <div id="doc-upload-form-error" class="form-error"></div>
      <form id="doc-upload-form">
        <div class="field">
          <label for="doc-upload-name">Name</label>
          <input type="text" id="doc-upload-name" required>
        </div>
        <div class="field">
          <label for="doc-upload-type">Document Type</label>
          <input type="text" id="doc-upload-type" placeholder="e.g. Identity">
        </div>
        <div class="field">
          <label for="doc-upload-file">File</label>
          <input type="file" id="doc-upload-file" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="doc-upload-submit-button">Upload</button>
          <button type="button" class="btn-secondary" id="doc-upload-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="doc-edit-modal-overlay">
    <div class="modal-card">
      <h2>Edit Document</h2>
      <div id="doc-edit-form-error" class="form-error"></div>
      <form id="doc-edit-form">
        <div class="field">
          <label for="doc-edit-name">Name</label>
          <input type="text" id="doc-edit-name" required>
        </div>
        <div class="field">
          <label for="doc-edit-type">Document Type</label>
          <input type="text" id="doc-edit-type" placeholder="e.g. Identity">
        </div>
        <div class="field">
          <label for="doc-edit-status">Status</label>
          <select id="doc-edit-status">
            <option value="Pending verification">Pending verification</option>
            <option value="Verified">Verified</option>
            <option value="On file">On file</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="doc-edit-submit-button">Update Document</button>
          <button type="button" class="btn-secondary" id="doc-edit-cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    const API_BASE = 'http://127.0.0.1:8000/api/v1/employees/';
    const DEPARTMENTS_API_BASE = 'http://127.0.0.1:8000/api/v1/departments/';
    const BRANCHES_API_BASE = 'http://127.0.0.1:8000/api/v1/branches/';

    if (!token) {
      window.location.href = 'login.html';
    } else {
      loadEmployees();
      loadDepartmentAndBranchOptions();
    }

    const navToggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');
    if (navToggle && navLinks) {
      navToggle.addEventListener('click', function () {
        navLinks.classList.toggle('open');
      });
    }

    async function loadDepartmentAndBranchOptions() {
      try {
        const [deptResponse, branchResponse] = await Promise.all([
          fetch(DEPARTMENTS_API_BASE, { headers: { 'Authorization': 'Bearer ' + token } }),
          fetch(BRANCHES_API_BASE, { headers: { 'Authorization': 'Bearer ' + token } })
        ]);

        if (!deptResponse.ok || !branchResponse.ok) {
          return;
        }

        const departments = await deptResponse.json();
        const branches = await branchResponse.json();

        const departmentSelect = document.getElementById('department');
        const branchSelect = document.getElementById('branch');

        departmentSelect.innerHTML = '<option value="" disabled selected>Select department</option>' +
          departments.map(function (d) {
            return '<option value="' + d.name.replace(/"/g, '&quot;') + '">' + d.name + '</option>';
          }).join('');

        branchSelect.innerHTML = '<option value="" disabled selected>Select branch</option>' +
          branches.map(function (b) {
            return '<option value="' + b.name.replace(/"/g, '&quot;') + '">' + b.name + '</option>';
          }).join('');
      } catch (err) {
        // Leave the placeholder options in place if master data can't be loaded.
      }
    }

    const form = document.getElementById('employee-form');
    const formTitle = document.getElementById('form-title');
    const formError = document.getElementById('form-error');
    const submitButton = document.getElementById('submit-button');
    const cancelEditButton = document.getElementById('cancel-edit-button');
    const searchInput = document.getElementById('search-input');
    const tabActive = document.getElementById('tab-active');
    const tabLeaver = document.getElementById('tab-leaver');

    const listView = document.getElementById('list-view');
    const profileView = document.getElementById('profile-view');

    let editingId = null;
    let allEmployees = [];
    let currentTab = 'active';
    let searchTerm = '';

    form.addEventListener('submit', handleSubmit);
    cancelEditButton.addEventListener('click', exitEditMode);
    searchInput.addEventListener('input', function () {
      searchTerm = searchInput.value.trim().toLowerCase();
      renderEmployees();
    });
    tabActive.addEventListener('click', function () {
      setTab('active');
    });
    tabLeaver.addEventListener('click', function () {
      setTab('leaver');
    });

    function setTab(tab) {
      currentTab = tab;
      tabActive.classList.toggle('active', tab === 'active');
      tabLeaver.classList.toggle('active', tab === 'leaver');
      renderEmployees();
    }

    async function loadEmployees() {
      const content = document.getElementById('content');

      try {
        const response = await fetch(API_BASE, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (response.status === 401) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to load employees.');
        }

        allEmployees = await response.json();
        renderEmployees();
      } catch (err) {
        content.innerHTML = '<div class="error-state"><div>' +
          escapeHtml(err.message || 'Could not load employees.') +
          '</div><button type="button" class="btn-secondary" id="retry-employees-button">Retry</button></div>';
        document.getElementById('retry-employees-button').addEventListener('click', loadEmployees);
      }
    }

    function isActiveStatus(status) {
      return String(status || '').toLowerCase() === 'active';
    }

    function updateTabCounts() {
      const activeCount = allEmployees.filter(function (e) { return isActiveStatus(e.status); }).length;
      const leaverCount = allEmployees.length - activeCount;
      tabActive.textContent = 'Active (' + activeCount + ')';
      tabLeaver.textContent = 'Leaver (' + leaverCount + ')';
    }

    function getFilteredEmployees() {
      let list = allEmployees.filter(function (e) {
        return currentTab === 'active' ? isActiveStatus(e.status) : !isActiveStatus(e.status);
      });

      if (searchTerm) {
        list = list.filter(function (e) {
          return [e.name, e.department, e.designation, e.branch].some(function (field) {
            return String(field || '').toLowerCase().indexOf(searchTerm) !== -1;
          });
        });
      }

      return list;
    }

    function renderEmployees() {
      const content = document.getElementById('content');

      updateTabCounts();
      const employees = getFilteredEmployees();

      if (!employees || employees.length === 0) {
        content.innerHTML = '<div class="message">No employees found.</div>';
        return;
      }

      const rows = employees.map(function (emp) {
        const statusClass = isActiveStatus(emp.status)
          ? 'status-active'
          : (String(emp.status || '').toLowerCase() === 'inactive' ? 'status-inactive' : 'status-other');

        const bloodGroup = emp.blood_group ? escapeHtml(emp.blood_group) : '&mdash;';
        const docsCount = emp.docs_count !== undefined && emp.docs_count !== null ? emp.docs_count : 0;
        const kraHtml = (emp.kra_score !== undefined && emp.kra_score !== null)
          ? '<span class="badge badge-kra">' + escapeHtml(emp.kra_score) + '/100</span>'
          : '<span class="badge badge-new">New</span>';

        return '<tr class="clickable-row" data-row-id="' + escapeHtml(emp.id) + '">' +
          '<td>' + escapeHtml(emp.name) + '</td>' +
          '<td>' + escapeHtml(emp.department) + '</td>' +
          '<td>' + escapeHtml(emp.designation) + '</td>' +
          '<td>' + escapeHtml(emp.branch) + '</td>' +
          '<td><span class="status ' + statusClass + '">' + escapeHtml(emp.status) + '</span></td>' +
          '<td>' + bloodGroup + '</td>' +
          '<td><span class="badge badge-docs">' + escapeHtml(docsCount) + '</span></td>' +
          '<td>' + kraHtml + '</td>' +
          '<td>' +
          '<button type="button" class="btn-edit btn-row" data-id="' + escapeHtml(emp.id) + '">Edit</button>' +
          '<button type="button" class="btn-delete btn-row" data-id="' + escapeHtml(emp.id) + '">Delete</button>' +
          '</td>' +
          '</tr>';
      }).join('');

      content.innerHTML =
        '<table>' +
        '<thead><tr>' +
        '<th>Name</th><th>Department</th><th>Designation</th><th>Branch</th><th>Status</th>' +
        '<th>Blood Group</th><th>Docs</th><th>KRA</th><th>Actions</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '</table>';

      content.querySelectorAll('.btn-edit').forEach(function (btn) {
        btn.addEventListener('click', function (event) {
          event.stopPropagation();
          enterEditMode(btn.getAttribute('data-id'));
        });
      });

      content.querySelectorAll('.btn-delete').forEach(function (btn) {
        btn.addEventListener('click', function (event) {
          event.stopPropagation();
          handleDelete(btn.getAttribute('data-id'));
        });
      });

      content.querySelectorAll('tr.clickable-row').forEach(function (row) {
        row.addEventListener('click', function () {
          openProfile(row.getAttribute('data-row-id'));
        });
      });
    }

    function fillEmployeeForm(employee) {
      document.getElementById('name').value = employee.name || '';
      document.getElementById('email').value = employee.email || '';
      document.getElementById('phone').value = employee.phone || '';
      document.getElementById('department').value = employee.department || '';
      document.getElementById('designation').value = employee.designation || '';
      document.getElementById('branch').value = employee.branch || '';
      document.getElementById('date_of_joining').value = employee.date_of_joining || '';
      document.getElementById('ctc').value = employee.ctc !== undefined ? employee.ctc : '';
      document.getElementById('status').value = employee.status || 'active';
      document.getElementById('blood_group').value = employee.blood_group || '';
      document.getElementById('kra_score').value = (employee.kra_score !== undefined && employee.kra_score !== null)
        ? employee.kra_score
        : '';
      document.getElementById('dob').value = employee.dob || '';
      document.getElementById('marital_status').value = employee.marital_status || '';
      document.getElementById('pan').value = employee.pan || '';
      document.getElementById('aadhaar').value = employee.aadhaar || '';
      document.getElementById('uan').value = employee.uan || '';
      document.getElementById('esic').value = employee.esic || '';
      document.getElementById('bank_account').value = employee.bank_account || '';
      document.getElementById('pf_nomination_on_file').checked = !!employee.pf_nomination_on_file;
      document.getElementById('gratuity_nomination_on_file').checked = !!employee.gratuity_nomination_on_file;
      document.getElementById('policy_accepted').checked = !!employee.policy_accepted;
    }

    function enterEditMode(id) {
      const employee = allEmployees.find(function (e) { return e.id === id; })
        || (currentProfileEmployee && currentProfileEmployee.id === id ? currentProfileEmployee : null);
      if (!employee) {
        return;
      }

      editingId = id;
      formTitle.textContent = 'Edit Employee';
      submitButton.textContent = 'Update Employee';
      cancelEditButton.style.display = 'inline-block';

      fillEmployeeForm(employee);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exitEditMode() {
      editingId = null;
      formTitle.textContent = 'Add Employee';
      submitButton.textContent = 'Add Employee';
      cancelEditButton.style.display = 'none';
      form.reset();
      hideFormError();
    }

    async function handleSubmit(event) {
      event.preventDefault();
      hideFormError();
      submitButton.disabled = true;

      const kraValue = document.getElementById('kra_score').value;

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        department: document.getElementById('department').value,
        designation: document.getElementById('designation').value,
        branch: document.getElementById('branch').value,
        date_of_joining: document.getElementById('date_of_joining').value,
        ctc: parseFloat(document.getElementById('ctc').value),
        status: document.getElementById('status').value,
        blood_group: document.getElementById('blood_group').value,
        kra_score: kraValue === '' ? null : parseInt(kraValue, 10),
        dob: document.getElementById('dob').value || null,
        marital_status: document.getElementById('marital_status').value,
        pan: document.getElementById('pan').value,
        aadhaar: document.getElementById('aadhaar').value,
        uan: document.getElementById('uan').value,
        esic: document.getElementById('esic').value,
        bank_account: document.getElementById('bank_account').value,
        pf_nomination_on_file: document.getElementById('pf_nomination_on_file').checked,
        gratuity_nomination_on_file: document.getElementById('gratuity_nomination_on_file').checked,
        policy_accepted: document.getElementById('policy_accepted').checked
      };

      const isEditing = editingId !== null;
      const savedId = editingId;
      const url = isEditing ? API_BASE + editingId + '/' : API_BASE;
      const method = isEditing ? 'PATCH' : 'POST';

      try {
        const response = await fetch(url, {
          method: method,
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.status === 401) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
          return;
        }

        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          throw new Error(data.detail || 'Could not save employee.');
        }

        exitEditMode();
        await loadEmployees();

        if (savedId && currentProfileEmployee && currentProfileEmployee.id === savedId) {
          await refreshProfile();
        }
      } catch (err) {
        showFormError(err.message || 'Something went wrong. Please try again.');
      } finally {
        submitButton.disabled = false;
      }
    }

    async function handleDelete(id) {
      const confirmed = confirm('Are you sure you want to delete this employee?');
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(API_BASE + id + '/', {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (response.status === 401) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
          return;
        }

        if (!response.ok && response.status !== 204) {
          throw new Error('Could not delete employee.');
        }

        if (editingId === id) {
          exitEditMode();
        }

        if (currentProfileEmployee && currentProfileEmployee.id === id) {
          closeProfile();
        }

        loadEmployees();
      } catch (err) {
        showFormError(err.message || 'Something went wrong. Please try again.');
      }
    }

    function showFormError(message) {
      formError.textContent = message;
      formError.style.display = 'block';
    }

    function hideFormError() {
      formError.textContent = '';
      formError.style.display = 'none';
    }

    function escapeHtml(value) {
      if (value === undefined || value === null) {
        return '';
      }
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function getInitials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) {
        return '?';
      }
      if (parts.length === 1) {
        return parts[0].charAt(0).toUpperCase();
      }
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function formatCurrency(value) {
      const number = Number(value);
      if (isNaN(number)) {
        return '&mdash;';
      }
      try {
        return new Intl.NumberFormat('en-IN', {
          style: 'currency',
          currency: 'INR',
          maximumFractionDigits: 0
        }).format(number);
      } catch (err) {
        return String(number);
      }
    }

    async function fetchEmployee(id) {
      const response = await fetch(API_BASE + id + '/', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token
        }
      });

      if (response.status === 401) {
        localStorage.removeItem('authToken');
        window.location.href = 'login.html';
        return null;
      }

      if (!response.ok) {
        throw new Error('Failed to load employee.');
      }

      return response.json();
    }

    async function openProfile(id) {
      try {
        const employee = await fetchEmployee(id);
        if (!employee) {
          return;
        }
        currentProfileEmployee = employee;
        currentProfileTab = 'personal';
        listView.style.display = 'none';
        profileView.style.display = 'block';
        renderProfile();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        window.location.href = 'login.html';
      }
    }

    async function refreshProfile() {
      if (!currentProfileEmployee) {
        return;
      }
      try {
        const employee = await fetchEmployee(currentProfileEmployee.id);
        if (!employee) {
          return;
        }
        currentProfileEmployee = employee;
        renderProfile();
      } catch (err) {
        // If the employee can no longer be fetched, fall back to the list view.
        closeProfile();
      }
    }

    function closeProfile() {
      currentProfileEmployee = null;
      profileView.style.display = 'none';
      listView.style.display = 'block';
      loadEmployees();

      currentProfileTab = tab;

      return docs.find(function (d) {

    function renderDocStatusChip(docItem) {
      if (!docItem) {
        return '<span class="badge badge-not-uploaded">Not uploaded</span>';
      }
      const isPending = String(docItem.status || '').toLowerCase() === 'pending verification';
      const chipClass = isPending ? 'badge-doc-pending' : 'badge-doc-ok';
      return '<span class="badge ' + chipClass + '">' + escapeHtml(docItem.status) + '</span>';
    }

      if (!docItem) {
        return '<button type="button" class="btn-secondary doc-upload-btn" data-name="' + escapeHtml(itemName) + '">+ Upload</button>';

      return (
        '<a href="' + escapeHtml(docItem.file_path) + '" target="_blank" rel="noopener noreferrer" class="btn-view">View</a>' +

    function renderDocumentsTab(container) {
      const emp = currentProfileEmployee;
      const docs = emp.docs || [];

      const allItemNames = DOCUMENT_CHECKLIST.reduce(function (acc, group) {
        return acc.concat(group.items);
      }, []);
      const onFileCount = allItemNames.filter(function (name) {
        return !!findDocByName(docs, name);
      }).length;

      const categoryBlocks = DOCUMENT_CHECKLIST.map(function (group) {
        const rows = group.items.map(function (itemName) {
          const docItem = findDocByName(docs, itemName);
          return '<tr>' +
            '<td>' + escapeHtml(itemName) + '</td>' +
            '<td>' + renderDocStatusChip(docItem) + '</td>' +
            '<td>' + renderDocActions(docItem, itemName) + '</td>' +
            '</tr>';
        }).join('');

        return '<h3>' + escapeHtml(group.category) + '</h3>' + renderDocTable(rows);
      }).join('');

      const matchedNamesLower = allItemNames.map(function (n) { return n.toLowerCase(); });
      const extraDocs = docs.filter(function (d) {
        return matchedNamesLower.indexOf(String(d.name || '').toLowerCase()) === -1;
      });

      const extraSection = extraDocs.length === 0
        ? ''
        : '<h3>Other documents</h3>' + renderDocTable(extraDocs.map(function (docItem) {
          return '<tr>' +
            '<td>' + escapeHtml(docItem.name) + '</td>' +
            '<td>' + renderDocStatusChip(docItem) + '</td>' +
            '<td>' + renderDocActions(docItem, docItem.name) + '</td>' +
            '</tr>';

      container.innerHTML =
        '<div class="section-heading-row">' +
        '<h3 style="margin-bottom: 0;">Document Vault</h3>' +

      container.querySelectorAll('.doc-upload-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          openDocUploadModal(btn.getAttribute('data-name'));

      document.getElementById('upload-another-doc-button').addEventListener('click', function () {

      container.querySelectorAll('.doc-edit-btn').forEach(function (btn) {

    function computeSalaryBreakup(ctc) {
      const annualCtc = Number(ctc) || 0;
      const monthlyGross = annualCtc / 12;
      const basic = 0.5 * monthlyGross;
      const hra = 0.4 * basic;
      const employerPf = Math.min(0.12 * basic, 1800);
      const netMonthly = monthlyGross - employerPf;
      return { monthlyGross, basic, hra, employerPf, netMonthly };
    }

    function formatMoney(value) {
      try {
        return new Intl.NumberFormat('en-IN', {
          style: 'currency',
          currency: 'INR',
          maximumFractionDigits: 0
        }).format(value);
      } catch (err) {
        return String(Math.round(value));
      }
    }

    function buildLetterReferenceNumber(letterType) {
      const code = LETTER_TYPE_CODES[letterType] || 'GEN';
      const year = new Date().getFullYear();
      const random = Math.floor(100 + Math.random() * 900);
      return 'SFPL/HR/' + code + '/' + year + '/' + random;
    }

      const salaryRow = function (label, monthly) {
        return '<tr><td>' + label + '</td><td>' + formatMoney(monthly) + '</td><td>' + formatMoney(monthly * 12) + '</td></tr>';
      };

      return (
        '<div class="letterhead"><h2>Sellon Finserv Pvt. Ltd.</h2></div>' +
        '<div class="letter-meta-row"><span>Ref: ' + fields.refNumber + '</span><span>Date: ' + todayStr + '</span></div>' +
        '<h3 class="letter-title">' + escapeHtml(fields.letterType) + '</h3>' +
        '<div class="letter-body">' +
        paragraphs.map(function (p) { return '<p>' + escapeHtml(p) + '</p>'; }).join('') +
        '</div>' +
        '<h3>Salary Annexure</h3>' +
        '<table>' +
        '<thead><tr><th>Component</th><th>Monthly</th><th>Annual</th></tr></thead>' +
        '<tbody>' +
        salaryRow('Basic', breakup.basic) +
        salaryRow('HRA', breakup.hra) +
        salaryRow('Employer PF Contribution', breakup.employerPf) +
        salaryRow('Monthly Gross', breakup.monthlyGross) +

    function handlePrintLetter() {
      document.body.classList.add('printing-letter');

      };
      window.addEventListener('afterprint', cleanup);
      window.print();
    }

    function handleDownloadLetter() {
      if (!currentLetterHtml || !currentLetterMeta) {
        return;
      }
      const blob = new Blob([buildStandaloneLetterDocument()], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = currentLetterMeta.letterType.replace(/\s+/g, '_') + '_' + currentLetterMeta.dateStr + '.html';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

      const fileName = currentLetterMeta.letterType.replace(/\s+/g, '_') + '_' + currentLetterMeta.dateStr + '.html';
      const file = new File([blob], fileName, { type: 'text/html' });

      const formData = new FormData();
      formData.append('name', currentLetterMeta.letterType + ' - ' + currentLetterMeta.dateStr);
      formData.append('doc_type', 'Letter');
      formData.append('status', 'On file');
      formData.append('file', file);

      try {
        const response = await fetch(
          API_BASE + currentProfileEmployee.id + '/documents/',
          {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + token
            },
            body: formData
          }
        );

        if (response.status === 401) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
          return;
        }

        if (!response.ok) {

        }

        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          throw new Error(data.detail || 'Could not update document.');
        }

        const updatedEmployee = await response.json();
        currentProfileEmployee = updatedEmployee;
        closeDocEditModal();
        renderProfile();
      } catch (err) {
        docEditFormError.textContent = err.message || 'Something went wrong. Please try again.';
        docEditFormError.style.display = 'block';
      } finally {
        docEditSubmitButton.disabled = false;
      }
    }

    async function handleDocDelete(docId) {
      if (!currentProfileEmployee) {
        return;
      }

      const confirmed = confirm('Are you sure you want to delete this document?');
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(
          API_BASE + currentProfileEmployee.id + '/documents/' + docId + '/',
          {
            method: 'DELETE',
            headers: {
              'Authorization': 'Bearer ' + token
            }
          }
        );

        if (response.status === 401) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
          return;
        }

        if (!response.ok) {
          throw new Error('Could not delete document.');
        }

        const updatedEmployee = await response.json();
        currentProfileEmployee = updatedEmployee;
        renderProfile();
      } catch (err) {
        showFormError(err.message || 'Something went wrong. Please try again.');
      }
    }
  </script>

</body>
</html>
